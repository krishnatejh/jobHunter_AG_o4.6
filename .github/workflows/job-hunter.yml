name: Job Hunter Automation

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      force_rescore:
        description: "Re-score all jobs instead of reusing cached analysis"
        required: false
        default: false
        type: boolean
      company:
        description: "Optional company name from config.json for a scoped manual run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      OPENROUTER_FAST_API_KEY: ${{ secrets.OPENROUTER_FAST_API_KEY }}
      OPENROUTER_PREMIUM_API_KEY: ${{ secrets.OPENROUTER_PREMIUM_API_KEY }}
      OPENROUTER_QA_API_KEY: ${{ secrets.OPENROUTER_QA_API_KEY }}
      OPENROUTER_FAST_MODEL: ${{ vars.OPENROUTER_FAST_MODEL }}
      OPENROUTER_PREMIUM_MODEL: ${{ vars.OPENROUTER_PREMIUM_MODEL }}
      OPENROUTER_QA_MODEL: ${{ vars.OPENROUTER_QA_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore persisted state cache
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/job_history.db
            data/company_cache.json
            output/latest_report.html
            output/last_run_summary.json
          key: jobhunter-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jobhunter-state-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation pipeline
        shell: bash
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_rescore }}" = "true" ]; then
            FORCE_FLAG="--force-rescore"
          fi
          if [ -n "${{ github.event.inputs.company }}" ]; then
            python scripts/automation_runner.py --resume resume.pdf --summary-json output/last_run_summary.json $FORCE_FLAG --company "${{ github.event.inputs.company }}"
          else
            python scripts/automation_runner.py --resume resume.pdf --summary-json output/last_run_summary.json $FORCE_FLAG
          fi

      - name: Save refreshed state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/job_history.db
            data/company_cache.json
            output/latest_report.html
            output/last_run_summary.json
          key: jobhunter-state-${{ runner.os }}-${{ github.run_id }}

      - name: Upload current report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobhunter-report-${{ github.run_number }}
          path: |
            output/latest_report.html
            output/last_run_summary.json
          if-no-files-found: warn
          retention-days: 14


