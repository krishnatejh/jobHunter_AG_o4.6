name: Job Hunter Automation

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      force_rescore:
        description: "Re-score all jobs instead of reusing cached analysis"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore prior state artifact
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: job-hunter.yml
          name: jobhunter-state
          path: .automation-state
          if_no_artifact_found: warn

      - name: Restore cached files into workspace
        shell: bash
        run: |
          mkdir -p data output
          if [ -f .automation-state/data/job_history.db ]; then
            cp .automation-state/data/job_history.db data/job_history.db
          fi
          if [ -f .automation-state/data/company_cache.json ]; then
            cp .automation-state/data/company_cache.json data/company_cache.json
          fi
          if [ -f .automation-state/output/latest_report.html ]; then
            cp .automation-state/output/latest_report.html output/latest_report.html
          fi
          if [ -f .automation-state/output/last_run_summary.json ]; then
            cp .automation-state/output/last_run_summary.json output/last_run_summary.json
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation pipeline
        shell: bash
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_rescore }}" = "true" ]; then
            FORCE_FLAG="--force-rescore"
          fi
          python scripts/automation_runner.py --resume resume.pdf --summary-json output/last_run_summary.json $FORCE_FLAG

      - name: Package latest state
        if: always()
        shell: bash
        run: |
          mkdir -p .automation-state/data .automation-state/output
          if [ -f data/job_history.db ]; then
            cp data/job_history.db .automation-state/data/job_history.db
          fi
          if [ -f data/company_cache.json ]; then
            cp data/company_cache.json .automation-state/data/company_cache.json
          fi
          if [ -f output/latest_report.html ]; then
            cp output/latest_report.html .automation-state/output/latest_report.html
          fi
          if [ -f output/last_run_summary.json ]; then
            cp output/last_run_summary.json .automation-state/output/last_run_summary.json
          fi

      - name: Upload persistent state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobhunter-state
          path: .automation-state
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Upload current report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobhunter-report-${{ github.run_number }}
          path: |
            output/latest_report.html
            output/last_run_summary.json
          if-no-files-found: warn
          retention-days: 14
